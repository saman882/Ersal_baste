plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.ersalbaste'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.ersalbaste'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // کلید امضای ثابت: همه‌ی نسخه‌ها با یک کلید امضا می‌شوند تا نسخه‌ی جدید روی قبلی نصب شود.
    // (برای پروژه‌ی دانشجویی رمز داخل کد است؛ در اپ واقعی باید در GitHub Secrets باشد.)
    signingConfigs {
        release {
            storeFile rootProject.file('ersal-baste.jks')
            storePassword 'ersalbaste123'
            keyAlias 'ersalbaste'
            keyPassword 'ersalbaste123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // فایل نقشه‌ی تهران فشرده نشود تا مستقیم از داخل APK خوانده شود (بدون کپی)
    androidResources {
        noCompress 'pmtiles'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// عمداً هیچ کتابخانه‌ی خارجی استفاده نشده؛ فقط API خود اندروید.
dependencies { }
