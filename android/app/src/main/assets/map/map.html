<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="leaflet.css">
<style>
  html,body,#map{margin:0;height:100%;width:100%;background:#f2efe9}
  /* سنجاق ثابت وسط نقشه (مثل اسنپ و تپسی) */
  #pin{position:absolute;left:50%;top:50%;z-index:1000;pointer-events:none;display:none;
       transform:translate(-50%,-100%);transition:transform .15s}
  #pin.lift{transform:translate(-50%,-120%)}
  #pin .head{width:30px;height:30px;border-radius:50%;border:6px solid #1B9E4B;background:#fff;box-sizing:border-box;
             box-shadow:0 2px 6px rgba(0,0,0,.3)}
  #pin .stick{width:4px;height:16px;background:#111;margin:0 auto;border-radius:2px}
  #pin.dest .head{border-color:#D93025}
  #shadow{position:absolute;left:50%;top:50%;z-index:999;width:10px;height:4px;margin-left:-5px;margin-top:-2px;
          border-radius:50%;background:rgba(0,0,0,.35);display:none;pointer-events:none}
  .mk{width:22px;height:22px;border-radius:50%;border:5px solid #1B9E4B;background:#fff;box-sizing:border-box;
      box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .mk.dest{border-color:#D93025}
  .leaflet-control-attribution{font-size:9px}
</style>
</head>
<body>
<div id="map"></div>
<div id="pin"><div class="head"></div><div class="stick"></div></div>
<div id="shadow"></div>
<script src="leaflet.js"></script>
<script src="pmtiles.js"></script>
<script src="protomaps-leaflet.js"></script>
<script>
  // ---------- نقشه‌ی آفلاین تهران ----------
  // فایل tehran.pmtiles (داده‌ی OpenStreetMap، فقط محدوده‌ی تهران) داخل خود اپ است.
  // جاوااسکریپت بایت‌های لازم را از طریق پل جاوا (window.MapFile.read) می‌خواند؛
  // پس هیچ اینترنت، API یا کلیدی برای نقشه لازم نیست.
  function b64ToBuffer(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out.buffer;
  }
  var TehranSource = {
    getKey: function () { return 'tehran.pmtiles'; },
    getBytes: function (offset, length) {
      return Promise.resolve({ data: b64ToBuffer(window.MapFile.read(offset, length)) });
    }
  };

  // محدوده‌ی تهران (همان محدوده‌ای که فایل نقشه از آن برش داده شده)
  var TEHRAN = L.latLngBounds([35.55, 51.05], [35.85, 51.65]);
  var map = L.map('map', {zoomControl:false, maxBounds:TEHRAN, maxBoundsViscosity:1.0, minZoom:11, maxZoom:18})
             .setView([35.7010, 51.3910], 13);
  map.attributionControl.setPrefix(false);

  protomapsL.leafletLayer({
    url: new pmtiles.PMTiles(TehranSource),
    flavor: 'light',
    lang: 'fa',
    maxDataZoom: 14,          // داده تا زوم ۱۴ (برای حجم کمتر)؛ زوم‌های بالاتر با بزرگ‌نمایی همان داده رسم می‌شوند
    attribution: '© OpenStreetMap'
  }).addTo(map);

  var pin = document.getElementById('pin'), shadow = document.getElementById('shadow');
  map.on('movestart', function(){ pin.classList.add('lift'); });
  map.on('moveend', function(){ pin.classList.remove('lift'); });

  var markers = {}, line = null;
  function icon(kind){ return L.divIcon({className:'', html:'<div class="mk '+kind+'"></div>', iconSize:[22,22], iconAnchor:[11,11]}); }

  function pickMode(kind){
    pin.className = kind === 'dest' ? 'dest' : '';
    pin.style.display = 'block'; shadow.style.display = 'block';
    if (markers[kind]) { map.removeLayer(markers[kind]); delete markers[kind]; }
  }
  function viewMode(){ pin.style.display = 'none'; shadow.style.display = 'none'; }
  function getCenter(){ var c = map.getCenter(); return JSON.stringify([c.lat, c.lng]); }
  function setMarker(kind, lat, lng){
    if (markers[kind]) map.removeLayer(markers[kind]);
    markers[kind] = L.marker([lat, lng], {icon:icon(kind)}).addTo(map);
  }
  function showRoute(oLat, oLng, dLat, dLng){
    viewMode();
    setMarker('origin', oLat, oLng); setMarker('dest', dLat, dLng);
    if (line) map.removeLayer(line);
    line = L.polyline([[oLat,oLng],[dLat,dLng]], {color:'#111', weight:3, dashArray:'6 8'}).addTo(map);
    map.fitBounds(line.getBounds(), {padding:[50,50]});
  }
</script>
</body>
</html>
